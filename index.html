<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفترچه متن ساده</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;min-height:100vh;background:#f3f4f6;font-family:Tahoma,Arial,sans-serif;display:flex;flex-direction:column;gap:12px}
#textBox{display:block;width:100%;height:50%;min-height:300px;padding:18px;resize:vertical;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#111827;font:17px/1.8 Tahoma,Arial,sans-serif;outline:none}
#textBox:focus{border-color:#64748b;box-shadow:0 0 0 3px rgba(100,116,139,.15)}
.actions{display:flex;gap:10px}
button{border:0;border-radius:8px;padding:12px 24px;font:15px Tahoma,Arial,sans-serif;cursor:pointer}
#copyBtn{background:#2563eb;color:white}
#clearBtn{background:#e5e7eb;color:#111827}
#status{min-height:20px;color:#475569;font-size:13px}
@media(max-width:480px){body{padding:10px}#textBox{height:calc(100vh - 105px)}.actions button{flex:1;padding:12px 8px}}
</style>
</head>
<body>
<textarea id="textBox" placeholder="متن خود را اینجا وارد کنید..."></textarea>
<div class="actions">
<button id="copyBtn" type="button">کپی متن</button>
<button id="clearBtn" type="button">پاک کردن صفحه</button>
</div>
<div id="status" aria-live="polite"></div>
<script>
const textBox=document.getElementById('textBox');
const status=document.getElementById('status');
document.getElementById('clearBtn').addEventListener('click',function(){
  textBox.value='';
  status.textContent='متن پاک شد.';
  textBox.focus();
});
document.getElementById('copyBtn').addEventListener('click',async function(){
  if(!textBox.value){status.textContent='متنی برای کپی کردن وجود ندارد.';return;}
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(textBox.value);}
    else{ textBox.focus();textBox.select();if(!document.execCommand('copy'))throw new Error('Copy failed');}
    status.textContent='متن با موفقیت کپی شد.';
  }catch(error){
    textBox.focus();textBox.select();
    status.textContent='متن انتخاب شد؛ برای کپی کلیدهای Ctrl+C را بزنید.';
  }
});
</script>
</body>
</html>
